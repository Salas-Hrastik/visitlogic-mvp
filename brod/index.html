<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Interaktivni prototip web sjedišta Turističke zajednice grada Slavonskog Broda. Nije službeno sjedište TZ-a.">
<title>Prototip Brod na Savi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

<style>
/* ============================================================
   BROD NA SAVI — prototip web sjedišta TZ Slavonski Brod
   Dizajn sustav prema Poglavlju 10.2 strateškog dokumenta
   ============================================================ */

:root{
  /* --- neutrali s blagim teal odmakom, ne čisti sivi --- */
  --ink:#101B1D;
  --ink-2:#43555A;
  --ink-3:#6B7D81;
  --paper:#FFFFFF;
  --paper-2:#F1F5F5;
  --paper-3:#E4EBEB;
  --line:#CFDBDC;
  --line-strong:#A9BCBE;

  /* --- brend: duboka savska --- */
  --brand:#0F4C5C;
  --brand-2:#0A3642;
  --brand-tint:#DCEAEC;
  --brand-fg:#FFFFFF;

  /* --- akcent: opeka Tvrđave --- */
  --brick:#B5451B;
  --brick-2:#8E3614;
  --brick-tint:#F7E3DA;
  --brick-fg:#FFFFFF;

  /* --- semantika --- */
  --ok:#1F7A45; --ok-tint:#DCEFE3;
  --warn:#8A5800; --warn-tint:#F7EBD2;
  --err:#B3261E; --err-tint:#F8DEDC;
  --focus:#0A66C2;

  /* --- toolbar prototipa --- */
  --bar:#08282F;
  --bar-ink:#CFE4E8;
  --bar-line:#1B4650;

  --radius:5px;
  --radius-lg:8px;
  --shadow:0 1px 2px rgba(16,27,29,.05), 0 8px 24px -12px rgba(16,27,29,.18);
  --maxw:1240px;

  --f-display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  color-scheme:light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EFEF; --ink-2:#A2B5B8; --ink-3:#7E9296;
    --paper:#0B1618; --paper-2:#122326; --paper-3:#1A3034;
    --line:#274043; --line-strong:#3C5C60;
    --brand:#5FB3C6; --brand-2:#8CCFDE; --brand-tint:#10333B; --brand-fg:#04191E;
    --brick:#E87B52; --brick-2:#F0997A; --brick-tint:#3A1D12; --brick-fg:#24120A;
    --ok:#5CC98A; --ok-tint:#123326;
    --warn:#DCA83A; --warn-tint:#332512;
    --err:#F08A82; --err-tint:#3A1614;
    --focus:#7FB6F0;
    --bar:#04161A; --bar-ink:#B9D3D8; --bar-line:#153238;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EFEF; --ink-2:#A2B5B8; --ink-3:#7E9296;
  --paper:#0B1618; --paper-2:#122326; --paper-3:#1A3034;
  --line:#274043; --line-strong:#3C5C60;
  --brand:#5FB3C6; --brand-2:#8CCFDE; --brand-tint:#10333B; --brand-fg:#04191E;
  --brick:#E87B52; --brick-2:#F0997A; --brick-tint:#3A1D12; --brick-fg:#24120A;
  --ok:#5CC98A; --ok-tint:#123326;
  --warn:#DCA83A; --warn-tint:#332512;
  --err:#F08A82; --err-tint:#3A1614;
  --focus:#7FB6F0;
  --bar:#04161A; --bar-ink:#B9D3D8; --bar-line:#153238;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.18;text-wrap:balance;
  letter-spacing:-.011em;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--brick);
  color:var(--brick-fg);padding:12px 18px;font-weight:600}
.skip:focus{left:8px;top:8px}

/* ===================== TOOLBAR PROTOTIPA ===================== */
.bar{position:sticky;top:0;z-index:60;background:var(--bar);color:var(--bar-ink);
  border-bottom:1px solid var(--bar-line)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:7px 16px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-size:10.5px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;background:var(--brick);color:#fff;padding:4px 8px;white-space:nowrap}
.bar-note{font-size:12.5px;color:var(--bar-ink);opacity:.85;min-width:0;flex:1 1 190px}
.bar-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar-btn{background:transparent;border:1px solid var(--bar-line);color:var(--bar-ink);
  padding:6px 10px;font-size:12.5px;border-radius:var(--radius);cursor:pointer;
  min-height:32px;display:inline-flex;align-items:center;gap:6px}
.bar-btn:hover{background:#0e343d;border-color:#2a5f6a}
.bar-btn[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);font-weight:600}
.bar-sel{background:#0e343d;border:1px solid var(--bar-line);color:var(--bar-ink);
  padding:6px 8px;font-size:12.5px;border-radius:var(--radius);min-height:32px}

/* ===================== OKVIR PRIKAZA ===================== */
.stage{padding:0}
.stage[data-vw="mobile"]{background:var(--paper-2);padding:22px 12px 40px}
.frame{background:var(--paper)}
.stage[data-vw="mobile"] .frame{max-width:400px;margin:0 auto;border:1px solid var(--line-strong);
  border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}

/* ===================== ZAGLAVLJE SJEDIŠTA ===================== */
.site-head{position:sticky;top:var(--barh,47px);z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line)}
@media (max-width:900px){.site-head{position:static}}
.stage[data-vw="mobile"] .site-head{position:static}
.head-in{max-width:var(--maxw);margin:0 auto;padding:10px 16px;display:flex;
  align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:0 0 auto}
.brand-mark{width:30px;height:30px;flex:0 0 auto}
.brand-txt{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.05;
  letter-spacing:-.02em}
.brand-txt small{display:block;font-weight:500;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;text-decoration:none;font-size:14.5px;font-weight:500;
  padding:10px 11px;border-radius:var(--radius);white-space:nowrap;min-height:44px;
  display:inline-flex;align-items:center}
.nav a:hover{background:var(--paper-2)}
.nav a[aria-current="page"]{font-weight:700}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:4px;
  height:2px;background:var(--brick)}
.util{display:flex;gap:4px;align-items:center;margin-left:6px}
.icon-btn{background:transparent;border:1px solid transparent;padding:0 10px;height:40px;
  min-width:44px;border-radius:var(--radius);cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:500}
.icon-btn:hover{background:var(--paper-2);border-color:var(--line)}
.count-dot{background:var(--brick);color:var(--brick-fg);font-size:11px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;
  justify-content:center;padding:0 5px;font-variant-numeric:tabular-nums}
.burger{display:none}

.stage[data-vw="mobile"] .nav{display:none}
.stage[data-vw="mobile"] .burger{display:inline-flex}
@media (max-width:900px){
  .nav{display:none}
  .burger{display:inline-flex}
}
/* kompaktno zaglavlje na uskim širinama */
.head-in{min-width:0}
.brand{min-width:0}
.stage[data-vw="mobile"] .head-in{gap:8px;padding:10px 12px}
.stage[data-vw="mobile"] #planLabel{display:none}
.stage[data-vw="mobile"] .util select{max-width:74px;padding:6px 4px;font-size:12px}
.stage[data-vw="mobile"] .brand-txt{font-size:14px}
.stage[data-vw="mobile"] .icon-btn{padding:0 7px;min-width:40px}
@media (max-width:560px){
  #planLabel{display:none}
  #langSel{display:none}
  .brand-txt small{display:none}
  .brand-txt{font-size:14px}
  .head-in{gap:6px;padding:10px 12px}
  .icon-btn{padding:0 6px;min-width:40px}
}
.stage[data-vw="mobile"] #langSel{display:none}
.stage[data-vw="mobile"] .brand-txt small{display:none}
.langrow{display:flex;gap:6px;padding:10px 8px 4px;border-top:1px solid var(--line);margin-top:6px}
.langrow button{flex:1;min-height:44px;border:1px solid var(--line-strong);background:var(--paper);
  border-radius:var(--radius);font-weight:600;cursor:pointer;font-size:14px}
.langrow button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}

.mobnav{display:none;border-top:1px solid var(--line);background:var(--paper-2);padding:8px}
.mobnav.open{display:block}
.mobnav a{display:block;text-decoration:none;padding:12px 14px;font-weight:600;
  border-radius:var(--radius);min-height:44px}
.mobnav a:hover{background:var(--paper-3)}

/* ===================== LAYOUT ===================== */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.stage[data-vw="mobile"] .wrap{padding:0 14px}
main{display:block;padding-bottom:56px}
.screen{display:none}
.screen.on{display:block}
.stack{display:flex;flex-direction:column;gap:14px}

.sec{margin-top:40px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.sec-head h2{font-size:21px;flex:0 0 auto}
.sec-rule{flex:1 1 40px;height:1px;background:var(--line);min-width:20px}
.sec-head .more{margin-left:auto;font-size:14px;font-weight:600;color:var(--brand);
  text-decoration:none;white-space:nowrap;padding:6px 0}
.sec-head .more:hover{text-decoration:underline}

.wref{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);border:1px dashed var(--line-strong);padding:3px 7px;border-radius:3px}

/* ===================== HERO ===================== */
.hero{position:relative;margin-top:0;background:var(--brand-2);color:#fff;overflow:hidden}
.hero-art{position:absolute;inset:0}
.hero-art svg{width:100%;height:100%;display:block}
.hero-in{position:relative;max-width:var(--maxw);margin:0 auto;padding:64px 16px 30px}
.stage[data-vw="mobile"] .hero-in{padding:38px 14px 22px}
.hero h1{font-size:clamp(34px,6.2vw,62px);letter-spacing:-.028em;color:#fff;max-width:15ch}
.hero .lede{margin-top:12px;font-size:clamp(16px,2.2vw,20px);color:#CFE4E8;max-width:34ch}
.hero .eyebrow{color:#8FBDC6}
.searchbox{margin-top:24px;display:flex;gap:8px;max-width:560px;flex-wrap:wrap}
.searchbox input{flex:1 1 200px;min-height:48px;padding:12px 14px;font-size:15px;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;
  border-radius:var(--radius)}
.searchbox input::placeholder{color:#A9C9D0}
.searchbox input:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* bastion — zasječeni kut, motiv tlocrta tvrđave */
.bastion{clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%)}

/* ===================== BRZI ULAZI ===================== */
.quick{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin-top:-26px;
  position:relative;z-index:2}
.quick a{background:var(--paper);border:1px solid var(--line);text-decoration:none;
  padding:14px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);
  min-height:88px;justify-content:flex-end}
.quick a:hover{border-color:var(--brick);transform:translateY(-2px)}
.quick a{transition:transform .16s ease, border-color .16s ease}
.quick .qk{font-family:var(--f-display);font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.quick .qs{font-size:12.5px;color:var(--ink-3)}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,1fr);margin-top:-18px}}
.stage[data-vw="mobile"] .quick{grid-template-columns:repeat(2,1fr);margin-top:-18px}

/* ===================== KARTICE ===================== */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stage[data-vw="mobile"] .g4,
.stage[data-vw="mobile"] .g3,
.stage[data-vw="mobile"] .g2{grid-template-columns:1fr}

.card{background:var(--paper);border:1px solid var(--line);display:flex;
  flex-direction:column;position:relative;overflow:hidden}
.card:hover{border-color:var(--line-strong)}
.card-media{position:relative;aspect-ratio:16/9;background:var(--paper-2);overflow:hidden}
.card-media svg{width:100%;height:100%;display:block}
.card-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-when{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--brand);font-variant-numeric:tabular-nums}
.card h3{font-size:17.5px}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0}
.card .lead{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12.5px;color:var(--ink-3);margin-top:auto}
.meta b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}

.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 7px;background:var(--paper);border:1px solid var(--line)}
.badge.free{background:var(--ok-tint);color:var(--ok);border-color:transparent}
.badge.demo{background:var(--warn-tint);color:var(--warn);border-color:transparent}
.badge.hot{background:var(--brick);color:var(--brick-fg);border-color:transparent}
.badge.off{background:var(--err-tint);color:var(--err);border-color:transparent}

.save{position:absolute;right:8px;top:8px;z-index:3;width:40px;height:40px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line);cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.save:hover{border-color:var(--brick)}
.save[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:var(--brick-fg)}
.save svg{width:18px;height:18px;display:block}

/* ===================== GUMBI ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:11px 17px;font-size:15px;font-weight:600;border-radius:var(--radius);cursor:pointer;
  border:1px solid transparent;text-decoration:none;transition:background .14s ease}
.btn-primary{background:var(--brick);color:var(--brick-fg)}
.btn-primary:hover{background:var(--brick-2)}
.btn-secondary{background:var(--paper);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--paper-2)}
.btn-ghost{background:transparent;color:var(--brand);padding:11px 8px}
.btn-ghost:hover{background:var(--brand-tint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:38px;padding:8px 13px;font-size:14px}
.btn-block{width:100%}

/* ===================== FILTRI ===================== */
.layout{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start;margin-top:22px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.stage[data-vw="mobile"] .layout{grid-template-columns:1fr}

.filters{border:1px solid var(--line);background:var(--paper-2);padding:4px 14px 14px;
  position:sticky;top:120px}
@media (max-width:900px){.filters{position:static;display:none}.filters.open{display:block}}
.stage[data-vw="mobile"] .filters{position:static;display:none}
.stage[data-vw="mobile"] .filters.open{display:block}
.filters fieldset{border:0;padding:0;margin:16px 0 0}
.filters legend{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);padding:0;margin-bottom:7px}
.opt{display:flex;align-items:center;gap:9px;padding:7px 4px;min-height:36px;cursor:pointer;
  font-size:14px;border-radius:3px}
.opt:hover{background:var(--paper-3)}
.opt input{width:20px;height:20px;accent-color:var(--brick);flex:0 0 auto;margin:0}
.opt .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.opt.zero{opacity:.42}
.opt.zero:hover{background:transparent}

.filter-toggle{display:none}
@media (max-width:900px){.filter-toggle{display:inline-flex}}
.stage[data-vw="mobile"] .filter-toggle{display:inline-flex}

.datebar{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-top:6px;
  scrollbar-width:thin}
.pill{border:1px solid var(--line-strong);background:var(--paper);padding:9px 14px;
  border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:42px}
.pill:hover{background:var(--paper-2)}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:600}

.resbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;
  border-bottom:1px solid var(--line);margin-bottom:16px}
.rescount{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--brand-tint);
  color:var(--brand);border:1px solid transparent;padding:5px 6px 5px 11px;border-radius:999px;
  font-size:13px;font-weight:600}
.chip button{background:transparent;border:0;cursor:pointer;width:22px;height:22px;
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;
  line-height:1;color:inherit}
.chip button:hover{background:rgba(0,0,0,.09)}
.clear{background:transparent;border:0;color:var(--ink-2);font-size:13.5px;cursor:pointer;
  text-decoration:underline;padding:6px}

.empty{border:1px dashed var(--line-strong);padding:26px 20px;text-align:left;background:var(--paper-2)}
.empty h3{font-size:18px;margin-bottom:8px}
.empty p{color:var(--ink-2);font-size:14.5px;max-width:52ch}
.empty .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

/* ===================== DETALJ ===================== */
.detail{display:grid;grid-template-columns:1fr 330px;gap:30px;align-items:start;margin-top:22px}
@media (max-width:960px){.detail{grid-template-columns:1fr}}
.stage[data-vw="mobile"] .detail{grid-template-columns:1fr}
.crumbs{font-size:13px;color:var(--ink-3);padding:14px 0 0;display:flex;gap:7px;flex-wrap:wrap}
.crumbs a{color:var(--ink-2);display:inline-flex;align-items:center;min-height:26px}
.detail-hero{aspect-ratio:21/9;background:var(--paper-2);overflow:hidden;margin-top:12px}
.detail-hero svg{width:100%;height:100%;display:block}
.detail h1{font-size:clamp(27px,4.2vw,40px);letter-spacing:-.025em;margin-top:14px}
.detail .lede{font-size:17.5px;color:var(--ink-2);margin-top:12px;max-width:62ch}
.prose{margin-top:20px;max-width:66ch}
.prose h2{font-size:20px;margin:26px 0 9px}
.prose p{margin-bottom:11px;color:var(--ink-2)}
.prose ul{margin:0 0 12px;padding-left:20px;color:var(--ink-2)}
.prose li{margin-bottom:5px}
.prose strong{color:var(--ink)}

.side{position:sticky;top:120px;display:flex;flex-direction:column;gap:14px}
@media (max-width:960px){.side{position:static}}
.stage[data-vw="mobile"] .side{position:static}
.panel{border:1px solid var(--line);background:var(--paper-2);padding:16px}
.panel h3{font-size:15px;margin-bottom:11px}
.facts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.fact{display:flex;gap:11px;font-size:14.5px;align-items:flex-start}
.fact .k{color:var(--ink-3);flex:0 0 78px;font-size:13px}
.fact .v{font-weight:600;font-variant-numeric:tabular-nums}
.panel .acts{display:flex;flex-direction:column;gap:8px}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14.5px;
  font-weight:600;min-height:44px}
.linkrow:hover{color:var(--brick)}
.linkrow .sub{font-weight:400;color:var(--ink-3);font-size:13px}

.checked{font-size:12.5px;color:var(--ink-3);margin-top:22px;padding-top:12px;
  border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.notice{border-left:3px solid var(--brick);background:var(--brick-tint);padding:12px 14px;
  font-size:14px;color:var(--ink)}
.notice.warn{border-color:var(--warn);background:var(--warn-tint)}
.notice.info{border-color:var(--brand);background:var(--brand-tint)}

/* tablica pristupačnosti / pogodnosti */
.tickets{display:flex;flex-direction:column;gap:6px;font-size:14.5px;margin-top:8px}
.tick{display:flex;gap:9px;align-items:baseline;color:var(--ink-2)}
.tick .y{color:var(--ok);font-weight:700}
.tick .n{color:var(--err);font-weight:700}

.amen{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.amen span{border:1px solid var(--line);padding:5px 10px;font-size:13px;border-radius:999px;
  color:var(--ink-2);background:var(--paper)}

/* ===================== VREMENSKA CRTA ITINERERA ===================== */
.tl{margin-top:20px;border-left:2px solid var(--line);padding-left:0;list-style:none}
.tl li{position:relative;padding:0 0 22px 24px;margin-left:-1px}
.tl li::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;
  border-radius:50%;background:var(--paper);border:3px solid var(--brand)}
.tl li.stop-eat::before{border-color:var(--brick)}
.tl .t{font-family:var(--f-display);font-size:12.5px;font-weight:700;color:var(--ink-3);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tl h3{font-size:17px;margin:2px 0 4px}
.tl .d{font-size:14px;color:var(--ink-2)}
.tl .walk{font-size:12.5px;color:var(--ink-3);margin-top:8px;font-style:italic}

/* ===================== KARTA ===================== */
.maplayout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:20px;align-items:start}
@media (max-width:860px){.maplayout{grid-template-columns:1fr}}
.stage[data-vw="mobile"] .maplayout{grid-template-columns:1fr}
.mapbox{position:relative;border:1px solid var(--line);background:var(--paper-2);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin circle{transition:r .15s ease}
.pin:hover circle.hit{r:15}
.mappop{border:1px solid var(--line-strong);background:var(--paper);padding:14px;
  margin-top:12px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.mappop .mm{width:74px;height:56px;flex:0 0 auto;overflow:hidden;background:var(--paper-2)}
.maplist{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.maplist h3{font-size:14px;margin-bottom:8px}
.maplist ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2);
  display:flex;flex-direction:column;gap:4px}

/* ===================== PRETRAGA ===================== */
.overlay{position:fixed;inset:0;z-index:120;background:rgba(8,24,28,.55);
  display:none;padding:64px 16px}
.overlay.open{display:block}
.searchpanel{max-width:640px;margin:0 auto;background:var(--paper);border:1px solid var(--line-strong);
  box-shadow:var(--shadow)}
.searchpanel .row{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.searchpanel input{flex:1;min-height:46px;padding:11px 13px;font-size:16px;
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:var(--radius)}
.sugg{max-height:52vh;overflow:auto;padding:6px}
.sugg .gh{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:12px 12px 5px}
.sugg a{display:flex;gap:11px;align-items:center;padding:10px 12px;text-decoration:none;
  border-radius:var(--radius);min-height:44px}
.sugg a:hover,.sugg a:focus-visible{background:var(--paper-2)}
.sugg .sname{font-weight:600;font-size:14.5px}
.sugg .smeta{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* ===================== AI INFORMATOR ===================== */
.fab{position:fixed;right:18px;bottom:18px;z-index:70;background:var(--brand);
  color:var(--brand-fg);border:0;border-radius:999px;padding:13px 19px;font-size:15px;
  font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;gap:9px;
  align-items:center;min-height:52px}
.fab:hover{background:var(--brand-2);color:var(--brand-fg)}
.stage[data-vw="mobile"] .fab{position:absolute}

.chat{border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;
  max-width:640px}
.chat-head{padding:13px 15px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.chat-head .disc{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.chat-log{padding:15px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.msg{max-width:88%;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-fg);padding:10px 13px;
  border-radius:12px 12px 3px 12px}
.msg.ai{align-self:flex-start}
.msg.ai .who{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.msg.ai .bubble{background:var(--paper-2);border:1px solid var(--line);padding:12px 14px;
  border-radius:12px 12px 12px 3px}
.msg.ai ul{margin:8px 0 0;padding-left:19px;color:var(--ink-2)}
.src{font-size:12.5px;color:var(--ink-3);margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.src a{color:var(--brand);font-weight:600}
.qacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.rate{display:flex;gap:8px;align-items:center;margin-top:11px;font-size:12.5px;color:var(--ink-3)}
.rate button{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);
  min-width:40px;min-height:36px;cursor:pointer}
.rate button:hover{border-color:var(--brand)}
.chat-sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 14px}
.chat-sugg button{border:1px solid var(--line-strong);background:var(--paper);padding:9px 13px;
  border-radius:999px;font-size:13.5px;cursor:pointer;text-align:left;min-height:40px}
.chat-sugg button:hover{border-color:var(--brand);background:var(--brand-tint)}
.chat-in{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line);background:var(--paper-2)}
.chat-in input{flex:1;min-height:44px;padding:10px 12px;font-size:15px;border:1px solid var(--line-strong);
  background:var(--paper);color:var(--ink);border-radius:var(--radius)}

/* ===================== OBRAZAC ===================== */
.form{display:flex;flex-direction:column;gap:13px;max-width:520px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 150px}
.field label{font-size:13.5px;font-weight:600}
.field input,.field textarea,.field select{min-height:44px;padding:10px 12px;font-size:15px;
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:var(--radius);
  font-family:inherit}
.field textarea{min-height:88px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:4px 0}
.check input{width:24px;height:24px;accent-color:var(--brick);margin-top:0;flex:0 0 auto}
.err-msg{color:var(--err);font-size:13px;font-weight:600}

/* ===================== PODNOŽJE ===================== */
.foot{border-top:1px solid var(--line);background:var(--paper-2);margin-top:56px;padding:34px 0 26px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:26px}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot-grid{grid-template-columns:1fr}}
.stage[data-vw="mobile"] .foot-grid{grid-template-columns:1fr}
.foot h3{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:11px}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.foot a{text-decoration:none;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;padding:6px 0;min-height:30px}
.foot a:hover{color:var(--brick)}
.foot address{font-style:normal;font-size:14px;color:var(--ink-2);line-height:1.75}
.social{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.social a{width:40px;height:40px;border:1px solid var(--line-strong);display:inline-flex;
  align-items:center;justify-content:center;font-family:var(--f-display);font-size:12px;
  font-weight:700;border-radius:var(--radius);background:var(--paper)}
.social a:hover{border-color:var(--brick);color:var(--brick)}
.nl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nl input{flex:1 1 150px;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);
  background:var(--paper);color:var(--ink);border-radius:var(--radius);font-size:15px}
.foot-bot{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;font-size:13px;
  color:var(--ink-3);display:flex;gap:8px 18px;flex-wrap:wrap}

/* ===================== MODAL ===================== */
.modal{position:fixed;inset:0;z-index:140;background:rgba(8,24,28,.6);display:none;
  padding:24px 16px;overflow:auto}
.modal.open{display:block}
.modal-in{max-width:640px;margin:40px auto;background:var(--paper);border:1px solid var(--line-strong);
  box-shadow:var(--shadow);padding:26px}
.modal-in h2{font-size:22px;margin-bottom:12px}
.modal-in p,.modal-in li{font-size:14.5px;color:var(--ink-2)}
.modal-in p{margin-bottom:11px}
.modal-in ul{padding-left:20px;margin-bottom:14px;display:flex;flex-direction:column;gap:5px}
.modal-close{position:absolute;right:0;top:0}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:160;
  background:var(--brand-2);color:#fff;padding:13px 18px;border-radius:var(--radius);
  font-size:14.5px;box-shadow:var(--shadow);max-width:min(460px,92vw);display:none}
.toast.on{display:block}

.notrans{display:inline-flex;align-items:center;gap:6px;background:var(--warn-tint);
  color:var(--warn);font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;
  letter-spacing:.03em}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;
  padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink-2);min-height:46px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brick)}
.tabs button:hover{color:var(--ink)}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   1. VIZUALNI MOTIVI

  bike: function(){ return ''
    + '<rect width="320" height="180" fill="#DDEAE4"/>'
    + '<path d="M-10 150 Q70 150 110 118 T210 84 T330 62" fill="none" stroke="#55703B" stroke-width="26" opacity=".28"/>'
    + '<path d="M-10 150 Q70 150 110 118 T210 84 T330 62" fill="none" stroke="#0F4C5C" stroke-width="2.4" stroke-dasharray="9 9"/>'
    + '<g fill="#B5451B"><circle cx="82" cy="140" r="6"/><circle cx="164" cy="100" r="6"/><circle cx="258" cy="72" r="6"/></g>'
    + '<g fill="none" stroke="#0F4C5C" stroke-width="2.6" opacity=".8">'
    + '<circle cx="42" cy="52" r="15"/><circle cx="86" cy="52" r="15"/><path d="M42 52 L60 32 L78 52 M64 52 L86 52"/></g>'; },

/* ============================================================
   2. DATUMI
   Veliki festivali koriste stvarne mjesece i prikazuju sljedeće
   izdanje; manja događanja generirana su relativno na današnji dan
   kako bi filtri "danas / ovaj vikend / 7 dana" uvijek radili.
   ============================================================ */
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
function iso(d){ return d.toISOString().slice(0,10); }
function plus(n){ var d=new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); }
function nextOn(m,day){
  var y=TODAY.getFullYear(), c=new Date(y,m-1,day);
  if(c < TODAY) c=new Date(y+1,m-1,day);
  return iso(c);
}
function addDays(isoStr,n){ var d=new Date(isoStr+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }

var MON = {
  hr:['siječnja','veljače','ožujka','travnja','svibnja','lipnja','srpnja','kolovoza','rujna','listopada','studenoga','prosinca'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December'],
  de:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
};
var DOW = {
  hr:['ned','pon','uto','sri','čet','pet','sub'],
  en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
  de:['So','Mo','Di','Mi','Do','Fr','Sa']
};
function fmtDate(isoStr,lang){
  var d=new Date(isoStr+'T00:00:00'), m=MON[lang][d.getMonth()];
  if(lang==='en') return d.getDate()+' '+m+' '+d.getFullYear();
  return d.getDate()+'. '+m+' '+d.getFullYear()+'.';
}
function fmtRange(a,b,lang){
  if(a===b) return fmtDate(a,lang);
  var da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  if(da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear()){
    if(lang==='en') return da.getDate()+'–'+db.getDate()+' '+MON.en[db.getMonth()]+' '+db.getFullYear();
    return da.getDate()+'.–'+db.getDate()+'. '+MON[lang][db.getMonth()]+' '+db.getFullYear()+'.';
  }
  return fmtDate(a,lang)+' – '+fmtDate(b,lang);
}
function shortWhen(a,b,lang){
  var da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  var ma=MON[lang][da.getMonth()].toUpperCase(), mb=MON[lang][db.getMonth()].toUpperCase();
  if(a===b) return DOW[lang][da.getDay()].toUpperCase()+' '+da.getDate()+'. '+ma;
  if(da.getMonth()===db.getMonth())
    return DOW[lang][da.getDay()].toUpperCase()+' '+da.getDate()+'.–'+db.getDate()+'. '+ma;
  return da.getDate()+'. '+ma+' – '+db.getDate()+'. '+mb;
}
function daysUntil(isoStr){ return Math.round((new Date(isoStr+'T00:00:00')-TODAY)/86400000); }
function wk(n){ var w=weekendRange(); return addDays(w[0], n||0); }
function weekendRange(){
  var dow=TODAY.getDay(), toFri=(5-dow+7)%7;
  var fri=new Date(TODAY); fri.setDate(fri.getDate()+toFri);
  var sun=new Date(fri); sun.setDate(sun.getDate()+2);
  return [iso(fri),iso(sun)];
}

function go(screen,param){

  document.getElementById('burger').setAttribute('aria-expanded','false');
  render();

  window.scrollTo({top:0, behavior:'auto'});
  if(st) st.scrollTop=0;
  var j=document.getElementById('jump');
  var key = param ? screen+':'+param : screen;
  for(var i=0;i<j.options.length;i++) if(j.options[i].value===key) j.selectedIndex=i;
}

function evInWindow(e){
  var d=S.ev.date;
  if(d==='all') return true;
  var du=P.daysUntil(e.to);
  if(du<0) return false;
  if(d==='today') return P.daysUntil(e.from)<=0 && du>=0;
  if(d==='weekend'){ var w=P.weekendRange(); return e.from<=w[1] && e.to>=w[0]; }
  return P.daysUntil(e.from) <= parseInt(d,10);
}
function priceBucket(p){ return p===0?'free' : p<=10?'10' : p<=25?'25' : '25p'; }
function evMatch(e,skip){
  if(!evInWindow(e)) return false;
  if(skip!=='type' && S.ev.type.length && S.ev.type.indexOf(e.type)<0) return false;
  if(skip!=='price' && S.ev.price.length && S.ev.price.indexOf(priceBucket(e.price))<0) return false;
  if(skip!=='aud' && S.ev.aud.length && !S.ev.aud.some(function(a){return e.audience.indexOf(a)>=0;})) return false;
  if(skip!=='a11y' && S.ev.a11y && !e.a11y) return false;
  return true;
}
function evList(){ return EVENTS.filter(function(e){return evMatch(e,null);})
  .sort(function(a,b){ return a.from<b.from?-1:a.from>b.from?1:0; }); }

function stMatch(s,skip){
  if(skip!=='kind' && S.st.kind.length && S.st.kind.indexOf(s.kind)<0) return false;
  if(skip!=='amen' && S.st.amen.length && !S.st.amen.every(function(a){return s.amen.indexOf(a)>=0;})) return false;
  if(skip!=='maxprice' && S.st.maxprice && s.from>S.st.maxprice) return false;
  if(skip!=='maxkm' && S.st.maxkm && s.km>S.st.maxkm) return false;
  return true;
}
function stList(){ return STAYS.filter(function(s){return stMatch(s,null);})
  .sort(function(a,b){return a.from-b.from;}); }

function eaMatch(r,skip){
  if(skip!=='kind' && S.ea.kind.length && S.ea.kind.indexOf(r.kind)<0) return false;
  if(skip!=='cuisine' && S.ea.cuisine.length && S.ea.cuisine.indexOf(r.cuisine)<0) return false;
  if(skip!=='diet' && S.ea.diet.length && !S.ea.diet.every(function(d){return r.diet.indexOf(d)>=0;})) return false;
  if(skip!=='terrace' && S.ea.terrace && !r.terrace) return false;
  return true;
}
function eaList(){ return EATS.filter(function(r){return eaMatch(r,null);}); }

function countIf(arr,fn){ var n=0; arr.forEach(function(x){ if(fn(x)) n++; }); return n; }

<script>
(function(){
"use strict";
var P=window.__PROTO, C=window.__CORE, A=window.__SCREENS_A;

function checkedLine(days){
  var d=new Date(P.TODAY); d.setDate(d.getDate()-(days||14));
  return '<div class="checked"><span>'+esc(t('checked'))+': <strong>'+esc(P.fmtDate(P.iso(d),S.lang))+'</strong></span>'
   + '<button class="clear" data-proto="report">'+esc(t('report'))+'</button></div>';

function factRow(k,v){ return '<div class="fact"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }

/* ---------------- DETALJ DOGAĐAJA (W4) ---------------- */
function screenEvent(id){

  var glance=[];
  glance.push(P.fmtRange(e.from,e.to,S.lang)+(e.time&&e.time!=='—'?', '+e.time:''));
  glance.push(e.place);
  glance.push(e.price===0?t('free'):(t('price')+': '+eur(e.price)));
  if(e.a11y) glance.push(t('a11y_yes'));

  var prog='';
  if(e.program){
    prog='<h2>'+esc(t('program'))+'</h2><div class="tickets">'+e.program.map(function(p){

       + '<span>'+esc(p.t)+' · '+esc(tx(p.h).t)+'</span></div>'; }).join('')+'</div>';
  }

       + '<summary style="cursor:pointer;font-weight:600;min-height:30px">'+esc(q.t)+'</summary>'
       + '<p style="margin-top:8px">'+esc(a.t)+'</p>'+fbTag(a)+'</details>'; }).join('');
  }

  var nearEat=EATS.slice(0,3);

  return '<div class="wrap">'
   + C.crumbs([[S.lang==='hr'?'Početna':'Home','home'],[t('nav_events'),'events'],[n.t,null]])

   + '<p>'+esc(S.lang==='hr'
      ? 'Najbliže parkiralište je uz Tvrđavu, 120 mjesta, prva pola sata besplatno. Od željezničkog kolodvora do mjesta događanja petnaest je minuta pješice ravnim putem.'

   + '</div>'+checkedLine(20)
   + '</div><aside class="side">'
   + '<div class="panel"><div class="facts">'
   + factRow(S.lang==='hr'?'Kada':'When', esc(P.fmtRange(e.from,e.to,S.lang)))
   + (e.time&&e.time!=='—'?factRow(S.lang==='hr'?'Vrijeme':'Time', esc(e.time)):'')
   + factRow(S.lang==='hr'?'Gdje':'Where', esc(e.place))
   + factRow(t('price'), e.price===0?esc(t('free')):eur(e.price))

   + '<button class="btn btn-primary" data-proto="ics">'+esc(t('addcal'))+'</button>'
   + '<button class="btn btn-secondary" data-save="'+e.id+'">'+esc(S.plan.has(e.id)?t('saved'):t('save'))+'</button>'
   + '<button class="btn btn-secondary" data-proto="share">'+esc(t('share'))+'</button>'
   + '</div></div>'
   + '<div class="panel"><h3>'+esc(t('where_sleep'))+'</h3>'

   + '<a class="linkrow" href="#" data-go="stay">'+esc(t('where_eat'))+' <span class="sub">'+EATS.length+'</span></a>'
   + '<a class="linkrow" href="#" data-go="map">'+esc(t('showmap'))+'</a></div>'
   + '</aside></div>'
   + (others.length?'<section class="sec">'+C.secHead(S.lang==='hr'?'Još':'More',t('similar'),'events')
      + '<div class="grid g3">'+others.map(C.eventCard).join('')+'</div></section>':'')
   + '<section class="sec">'+C.secHead(S.lang==='hr'?'Blizu':'Close by',t('where_eat'),'stay')
   + '<div class="grid g3">'+nearEat.map(C.eatCard).join('')+'</div></section>'
   + '</div>';

   + '<li>'+esc(S.lang==='hr'?'Boravišna pristojba 1,50 € po osobi i noćenju, plaća se na licu mjesta':'Tourist tax €1.50 per person per night, paid on site')+'</li></ul></div>'

function flatFind(id){
  var r=null;
  LAYERS.forEach(function(L){ L.items().forEach(function(it){ if(it.id===id) r=it; }); });

}

var chatLog=[];
function norm(s){
  return String(s).toLowerCase().replace(/\u0111/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function answer(qRaw){
  var q=norm(qRaw);
  var has=function(){ for(var i=0;i<arguments.length;i++){ if(q.indexOf(arguments[i])>=0) return true; } return false; };

  if(has('vikend','weekend','wochenende')){
    var w=P.weekendRange();
    var list=P.EVENTS.filter(function(e){return e.from<=w[1]&&e.to>=w[0];});
    if(!list.length) list=C.evList().slice(0,3);
    return { html:(S.lang==='hr'?'Ovaj vikend ('+P.fmtRange(w[0],w[1],S.lang)+') u Brodu je ovo:'
                   :'This weekend ('+P.fmtRange(w[0],w[1],S.lang)+') in Brod:')
      + '<ul>'+list.map(function(e){ return '<li><strong>'+esc(tx(e.name).t)+'</strong> — '
         + esc(P.fmtRange(e.from,e.to,S.lang))+', '+esc(e.place)+', '
         + (e.price===0?esc(t('free')):eur(e.price))+'</li>'; }).join('')+'</ul>',
      sources:[[t('nav_events'),'events',null]],
      actions:[[t('nav_events'),'events',null],[t('where_sleep'),'stay',null],[t('map_title'),'map',null]],
      answered:true };
  }
  if(has('jesti','hran','restoran','eat','food','essen','slavonsk')){
    var e2=EATS.filter(function(r){return r.cuisine==='slavonska';});
    return { html:(S.lang==='hr'?'Za slavonsku kuhinju u prototipu su navedena dva mjesta:'
                   :'For Slavonian cooking the prototype lists two places:')
      + '<ul>'+e2.map(function(r){ return '<li><strong>'+esc(tx(r.name).t)+'</strong> — '+esc(tx(r.lead).t)+' ('+'€'.repeat(r.pricelevel)+', '+esc(r.open)+')</li>'; }).join('')+'</ul>'
      + (S.lang==='hr'?'<p style="margin-top:8px">Radna vremena i cijene su demo podaci — u produkciji dolaze iz CMS-a s datumom zadnje provjere.</p>':''),
      sources:[[t('tab_eat'),'stay',null]],
      actions:[[t('tab_eat'),'stay',null]], answered:true };
  }
  if(has('2 sata','dva sata','two hours','2 hours','stunden','kratko','tranzit')){
    var it=ALL['i-2sata'];
    return { html:(S.lang==='hr'?'Postoji gotov plan za točno taj slučaj:':'There is a ready-made plan for exactly that:')
      + '<ul><li><strong>'+esc(tx(it.name).t)+'</strong> — '+esc(tx(it.lead).t)+'</li></ul>',
      sources:[[tx(it.name).t,'itin','i-2sata']],
      actions:[[S.lang==='hr'?'Otvori plan':'Open the plan','itin','i-2sata'],[t('map_title'),'map',null]], answered:true };
  }
  if(has('parkir','parking','parken')){
    var f=FAQS.filter(function(x){return x.id==='f-parking';})[0];
    return { html:'<p>'+esc(tx(f.a).t)+'</p>', sources:[['FAQ','discover',null]],
      actions:[[t('map_title'),'map',null]], answered:true };
  }
  if(has('vlak','kolodvor','train','station','bahnhof','bicikl','bike','rad ')){
    var f2=FAQS.filter(function(x){return x.id==='f-vlak';})[0];
    return { html:'<p>'+esc(tx(f2.a).t)+'</p><p style="margin-top:8px">'+esc(tx(FAQS.filter(function(x){return x.id==='f-bike';})[0].a).t)+'</p>',
      sources:[['FAQ','discover',null]], actions:[[S.lang==='hr'?'Plan bez auta':'No-car plan','itin','i-bezauta']], answered:true };
  }
  if(has('tvrdav','fortress','festung')){
    var a=ALL['a-tvrdjava'];
    return { html:'<p>'+esc(tx(a.lead).t)+'</p><p style="margin-top:8px"><strong>'+esc(t('hours'))+':</strong> '+esc(a.hours)
      + ' · <strong>'+esc(t('price'))+':</strong> '+eur(a.price)+' · <strong>'+esc(t('duration'))+':</strong> '+a.minutes+' min</p>',
      sources:[[tx(a.name).t,'attraction','a-tvrdjava']],
      actions:[[S.lang==='hr'?'Otvori stranicu':'Open page','attraction','a-tvrdjava'],[t('map_title'),'map',null]], answered:true };
  }
  if(has('spava','smjest','hotel','stay','sleep','ubernacht','übernacht')){
    return { html:(S.lang==='hr'?'U katalogu je '+STAYS.length+' objekata — od kampa uz nasip do hotela u centru. Možete filtrirati po vrsti, cijeni, udaljenosti i pogodnostima (parking, bicikli, pristupačnost).'

      sources:[[t('tab_stay'),'stay',null]], actions:[[t('tab_stay'),'stay',null]], answered:true };
  }
  return { html:(S.lang==='hr'
      ? '<p>Na to nemam pouzdan odgovor. Centar za posjetitelje: <strong>+385 35 447 721</strong>, info@tzgsb.hr — rado će vam pomoći.</p><p style="margin-top:8px;font-size:13px;color:var(--ink-3)">Vaše pitanje je zabilježeno u red za uredništvo. Tako informator sam generira popis sadržaja koji na sjedištu nedostaje (Poglavlje 9.6).</p>'
      : '<p>I do not have a reliable answer to that. The visitor centre: <strong>+385 35 447 721</strong>, info@tzgsb.hr — they will be glad to help.</p><p style="margin-top:8px;font-size:13px;color:var(--ink-3)">Your question has been logged for the editorial queue — this is how the assistant generates the list of missing content (chapter 9.6).</p>'),
    sources:[], actions:[[t('f_contact'),'contact',null]], answered:false };

     + (m.actions && m.actions.length ? '<div class="qacts">'
        + m.actions.map(function(a){return '<button class="btn btn-secondary btn-sm" data-go="'+a[1]+'"'+(a[2]?' data-param="'+a[2]+'"':'')+'>'+esc(a[0])+'</button>';}).join('')
        + '</div>' : '')
     + '<div class="rate"><span>'+esc(t('chat_useful'))+'</span>'
     + '<button data-rate="up" aria-label="Da">👍</button><button data-rate="down" aria-label="Ne">👎</button></div>'
     + '</div></div>';
  }).join('');

  return '<div class="wrap">'
   + C.crumbs([[S.lang==='hr'?'Početna':'Home','home'],[t('ask'),null]])
   + '<div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:10px">'
   + '<h1 style="font-size:clamp(26px,4vw,38px)">'+esc(t('ask'))+'</h1>'+C.wref('W12')+'</div>'
   + '<p style="max-width:62ch;color:var(--ink-2);margin-top:10px">'+esc(S.lang==='hr'
      ? 'Postojeći AI informator TZ-a ovdje je ugrađen u samo sjedište: crpi znanje iz istog sadržaja koji vidite na stranicama, citira izvor i nudi sljedeći korak. Odgovori u prototipu su skriptirani.'
      : 'The tourist board’s existing AI assistant is embedded in the site itself: it draws on the same content you see on the pages, cites its source and offers a next step. Answers in this prototype are scripted.')+'</p>'
   + '<div class="chat" style="margin-top:20px">'
   + '<div class="chat-head"><strong>'+esc(t('ask'))+'</strong><p class="disc">'+esc(t('chat_disc'))+'</p></div>'
   + '<div class="chat-log" role="log" aria-live="polite">'
   + (chatLog.length?log:'<div class="msg ai"><span class="who">'+esc(t('ask'))+'</span><div class="bubble">'+esc(t('chat_hello'))+'</div></div>')
   + '</div>'
   + '<div class="chat-sugg">'+CHAT_SUGG.map(function(s){
       var txt=s[C.LI[S.lang]]||s[0];
       return '<button data-askq="'+esc(txt)+'">'+esc(txt)+'</button>'; }).join('')+'</div>'
   + '<form class="chat-in" data-form="chat"><label class="sr" for="chatq">'+esc(t('chat_ph'))+'</label>'

   + '<div class="notice info" style="margin-top:18px;max-width:640px">'+esc(S.lang==='hr'
      ? 'Isprobajte i pitanje na koje informator nema odgovor (posljednji prijedlog) — prototip pokazuje propisano ponašanje: bez izmišljanja, s prelaskom na ljudsku podršku i zapisom pitanja za uredništvo.'
      : 'Try the question the assistant cannot answer (the last suggestion) — the prototype shows the required behaviour: no invention, a handover to human support and the question logged for the editors.')+'</div>'
   + '</div>';

/* ---------------- PRETRAGA ---------------- */
function searchAll(qRaw){
  var q=norm(qRaw).trim(); if(q.length<2) return [];
  var pool=[].concat(P.EVENTS,ATTR,STAYS,EATS,ITINS);
  return pool.map(function(x){
    var hay=norm([tx(x.name).t, tx(x.lead).t, x.place||'', x.kind||'', x.cat||''].join(' '));
    var i=hay.indexOf(q);
    return i<0?null:{x:x, score:i};
  }).filter(Boolean).sort(function(a,b){return a.score-b.score;}).map(function(r){return r.x;});
}
function screenSearch(){
  var q=S.param||'';
  var res=searchAll(q);
  return '<div class="wrap">'+C.crumbs([[S.lang==='hr'?'Početna':'Home','home'],[S.lang==='hr'?'Pretraga':'Search',null]])
   + '<h1 style="font-size:clamp(24px,3.6vw,34px);margin-top:10px">'+esc(S.lang==='hr'?'Rezultati za':'Results for')+' „'+esc(q)+'"</h1>'
   + '<p style="color:var(--ink-2);margin-top:8px">'+res.length+' '+esc(res.length===1?t('result1'):t('results'))+'</p>'
   + (res.length ? '<div class="grid g3" style="margin-top:20px">'+res.map(C.cardOf).join('')+'</div>'
     : '<div class="empty" style="margin-top:20px"><h3>'+esc(t('nosearch'))+' „'+esc(q)+'"</h3>'
       + '<p>'+esc(S.lang==='hr'?'Provjerite pravopis ili pokušajte općenitiji pojam. Svaka pretraga bez rezultata bilježi se i postaje uredničkim zadatkom.'
                :'Check the spelling or try a broader term. Every search without results is logged and becomes an editorial task.')+'</p>'
       + '<div class="acts"><button class="btn btn-secondary btn-sm" data-go="events">'+esc(t('nav_events'))+'</button>'
       + '<button class="btn btn-secondary btn-sm" data-go="stay">'+esc(t('nav_stay'))+'</button>'
       + '<button class="btn btn-primary btn-sm" data-go="ask">'+esc(t('ask_cta'))+'</button></div></div>')
   + '</div>';
}

window.__SCREENS_B = { screenEvent:screenEvent, screenAttraction:screenAttraction,
  screenStayItem:screenStayItem, screenItin:screenItin, screenMap:screenMap,
  screenAsk:screenAsk, screenSearch:screenSearch, searchAll:searchAll,
  chatLog:chatLog, answer:answer, mapLayerState:mapLayerState,
  setMapSel:function(v){ mapSel=v; }, norm:norm };
})();

<script>
(function(){

var P=window.__PROTO, C=window.__CORE, A=window.__SCREENS_A, B=window.__SCREENS_B;
var S=C.S, t=C.t, tx=C.tx, esc=C.esc, ALL=C.ALL;

/* ============================================================

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(el._tm); el._tm=setTimeout(function(){ el.classList.remove('on'); }, 3200);
}
var lastFocus=null;
function showModal(title,body){
  lastFocus=document.activeElement;
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  var m=document.getElementById('modal');
  m.classList.add('open');
  document.getElementById('modalClose').focus();
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.getElementById('modalClose').textContent = t('close');

document.addEventListener('click', function(ev){
  var el;

  if((el=ev.target.closest('[data-proto]'))){
    ev.preventDefault();
    var k=el.getAttribute('data-proto');
    var tbl = S.lang==='hr' ? PROTO_TEXT : PROTO_TEXT_EN;
    var e2 = tbl[k] || PROTO_TEXT.stub;
    showModal(e2[0], '<p>'+esc(e2[1])+'</p>'
      + '<p style="font-size:13px;color:var(--ink-3)">'+esc(S.lang==='hr'
         ? 'Prototip namjerno ne izvodi ovu radnju — cilj je provjeriti tok i razumijevanje, ne implementaciju.'
         : 'The prototype deliberately does not perform this action — the point is to test the flow, not the implementation.')+'</p>');
    return;
  }

  if((el=ev.target.closest('[data-save]'))){
    ev.preventDefault();
    var id=el.getAttribute('data-save');
    if(S.plan.has(id)){ S.plan.delete(id); toast(S.lang==='hr'?'Uklonjeno iz plana':'Removed from plan'); }
    else { S.plan.add(id); toast(S.lang==='hr'?'Spremljeno u plan':'Saved to your plan'); }
    C.persist(); render();
    return;
  }

  if((el=ev.target.closest('[data-staydates]'))){
    ev.preventDefault();
    S.stayDates = el.getAttribute('data-staydates').split('|');
    S.tab='stay';
    C.go('stay');
    return;
  }
  if(ev.target.closest('[data-cleardates]')){ ev.preventDefault(); S.stayDates=null; render(); return; }

  if((el=ev.target.closest('[data-date]'))){
    S.ev.date=el.getAttribute('data-date'); render(); return;
  }
  if((el=ev.target.closest('[data-tab]'))){
    S.tab=el.getAttribute('data-tab'); S.filtersOpen=false; render(); return;
  }
  if(ev.target.closest('[data-togglefilters]')){ S.filtersOpen=!S.filtersOpen; render(); return; }

  if((el=ev.target.closest('[data-chip]'))){
    var parts=el.getAttribute('data-chip').split(':'), g=parts[0], v=parts[1];
    var rm=function(arr,val){ var i=arr.indexOf(val); if(i>=0) arr.splice(i,1); };
    if(g==='type') rm(S.ev.type,v); else if(g==='price') rm(S.ev.price,v);
    else if(g==='aud') rm(S.ev.aud,v); else if(g==='a11y') S.ev.a11y=false;
    else if(g==='stkind') rm(S.st.kind,v); else if(g==='stamen') rm(S.st.amen,v);
    else if(g==='stprice') S.st.maxprice=0; else if(g==='stkm') S.st.maxkm=0;
    else if(g==='eakind') rm(S.ea.kind,v); else if(g==='eacuis') rm(S.ea.cuisine,v);
    else if(g==='eadiet') rm(S.ea.diet,v); else if(g==='eaterr') S.ea.terrace=false;
    render(); return;
  }
  if((el=ev.target.closest('[data-clearall]'))){
    var w=el.getAttribute('data-clearall');
    if(w==='ev'){ S.ev={date:'30',type:[],price:[],aud:[],a11y:false}; }
    if(w==='st'){ S.st={kind:[],amen:[],maxprice:0,maxkm:0}; }
    if(w==='ea'){ S.ea={kind:[],cuisine:[],diet:[],terrace:false}; }
    render(); return;
  }

  if((el=ev.target.closest('[data-askq]'))){
    ev.preventDefault(); ask(el.getAttribute('data-askq')); return;
  }
  if((el=ev.target.closest('[data-rate]'))){
    ev.preventDefault();
    toast(S.lang==='hr'
      ? 'Hvala. Ocjena ulazi u CSAT metriku informatora (cilj ≥ 4,2/5).'
      : 'Thank you. The rating feeds the assistant’s CSAT metric (target ≥ 4.2/5).');
    return;
  }

  if((el=ev.target.closest('[data-lang]'))){
    ev.preventDefault();
    S.lang=el.getAttribute('data-lang');
    document.documentElement.setAttribute('lang', S.lang);
    var sel=document.getElementById('langSel'); if(sel) sel.value=S.lang;
    render(); return;
  }
  if((el=ev.target.closest('[data-pin]'))){
    B.setMapSel(el.getAttribute('data-pin')); render(); return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(document.getElementById('modal').classList.contains('open')) closeModal();
    if(document.getElementById('searchOverlay').classList.contains('open')) closeSearch();
  }
  var p=e.target.closest && e.target.closest('[data-pin]');
  if(p && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); B.setMapSel(p.getAttribute('data-pin')); render(); }
});

document.addEventListener('change', function(ev){
  var el=ev.target;
  if(el.matches('[data-f]')){
    var g=el.getAttribute('data-f'), v=el.value;
    var tog=function(arr,val){ var i=arr.indexOf(val); if(i>=0) arr.splice(i,1); else arr.push(val); };
    if(g==='type') tog(S.ev.type,v);
    else if(g==='price') tog(S.ev.price,v);
    else if(g==='aud') tog(S.ev.aud,v);
    else if(g==='a11y') S.ev.a11y=el.checked;
    else if(g==='stkind') tog(S.st.kind,v);
    else if(g==='stamen') tog(S.st.amen,v);
    else if(g==='stprice') S.st.maxprice=parseInt(v,10)||0;
    else if(g==='stkm') S.st.maxkm=parseInt(v,10)||0;
    else if(g==='eakind') tog(S.ea.kind,v);
    else if(g==='eacuis') tog(S.ea.cuisine,v);
    else if(g==='eadiet') tog(S.ea.diet,v);
    else if(g==='eaterr') S.ea.terrace=el.checked;
    S.filtersOpen=true;
    render();
    return;
  }
  if(el.matches('[data-layer]')){
    B.mapLayerState[el.getAttribute('data-layer')]=el.checked;
    render(); return;
  }
});

document.addEventListener('submit', function(ev){
  var f=ev.target.closest('[data-form]');
  if(!f) return;
  ev.preventDefault();
  var kind=f.getAttribute('data-form');

  if(kind==='chat'){
    var inp=f.querySelector('#chatq');
    if(inp.value.trim()){ ask(inp.value.trim()); inp.value=''; }
    return;
  }
  if(kind==='nl'){
    var ok=document.getElementById('nlok');
    if(ok && !ok.checked){ toast(S.lang==='hr'?'Potrebna je privola za obradu podataka.':'Consent is required.'); return; }
    toast(S.lang==='hr'
      ? 'U produkciji sada slijedi e-pošta za potvrdu prijave (dvostruka privola).'
      : 'In production a double opt-in confirmation email would now be sent.');
    f.reset(); return;
  }
  if(kind==='contact'){
    toast(S.lang==='hr'?'Poruka bi bila poslana. Odgovor u jednom radnom danu.':'The message would be sent. Reply within one working day.');
    f.reset(); return;
  }
  if(kind==='enq'){
    var stayId=f.getAttribute('data-stay'), s=ALL[stayId];
    var i1=f.querySelector('#ei').value, i2=f.querySelector('#eo').value;
    var ad=parseInt(f.querySelector('#ea').value,10)||0;
    var ch=parseInt(f.querySelector('#ec').value,10)||0;
    var errEl=f.querySelector('#enqErr'), err='';
    var today=P.iso(P.TODAY);
    if(!i1||!i2) err = S.lang==='hr'?'Unesite datume dolaska i odlaska.':'Enter check-in and check-out dates.';
    else if(i1<today) err = S.lang==='hr'?'Datum dolaska ne može biti u prošlosti.':'The check-in date cannot be in the past.';
    else if(i2<=i1) err = S.lang==='hr'?'Datum odlaska mora biti nakon datuma dolaska.':'Check-out must be after check-in.';
    else if((ad+ch) > s.maxPer) err = (S.lang==='hr'
        ? 'Objekt prima najviše '+s.maxPer+' osoba po jedinici. Pogledajte veće objekte.'
        : 'This property takes at most '+s.maxPer+' people per unit. Try a larger property.');
    if(err){ errEl.textContent=err; errEl.hidden=false; errEl.scrollIntoView({block:'center'}); return; }
    errEl.hidden=true;
    var ref='SB-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
    showModal(t('enq_ok'),
      '<p><strong>'+esc(S.lang==='hr'?'Referenca':'Reference')+': '+ref+'</strong></p>'
      + '<p>'+esc(S.lang==='hr'
         ? 'Upit bi bio poslan objektu „'+tx(s.name).t+'" i istovremeno zabilježen u nadzornoj ploči TZ-a. Objekt obično odgovara u ~'+(s.reply||6)+' h.'
         : 'The enquiry would be sent to “'+tx(s.name).t+'” and logged in the tourist board dashboard at the same time. The property usually replies in about '+(s.reply||6)+' h.')+'</p>'
      + '<ul><li>'+esc(S.lang==='hr'?'Termin':'Dates')+': '+esc(P.fmtRange(i1,i2,S.lang))+'</li>'
      + '<li>'+esc(S.lang==='hr'?'Gosti':'Guests')+': '+ad+' '+esc(t('enq_ad')).toLowerCase()+(ch?', '+ch+' '+esc(t('enq_ch')).toLowerCase():'')+'</li></ul>'
      + '<p style="font-size:13px;color:var(--ink-3)">'+esc(S.lang==='hr'
         ? 'Nakon 48 sati bez odgovora sustav šalje podsjetnik objektu i upozorenje TZ-u; nakon 7 dana gost dobiva anketu. Poglavlje 8.6.'
         : 'After 48 hours without a reply the system reminds the property and alerts the board; after 7 days the guest receives a short survey. Chapter 8.6.')+'</p>');
    return;
  }
});

function ask(q){
  B.chatLog.push({me:true, text:q});
  var a=B.answer(q);
  B.chatLog.push({me:false, html:a.html, sources:a.sources, actions:a.actions});
  if(S.screen!=='ask') C.go('ask'); else render();
  var log=document.querySelector('.chat-log');
  if(log) log.scrollTop=log.scrollHeight;
}

function openSearch(){
  document.getElementById('searchOverlay').classList.add('open');
  var i=document.getElementById('q'); i.value=''; i.focus(); renderSugg('');
}
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('open'); }
function renderSugg(q){
  var box=document.getElementById('sugg');
  if(q.trim().length<2){
    var pop=['Tvrđava','Brodsko kolo','Smještaj','Bicikl','Parking'];
    box.innerHTML='<div class="gh">'+esc(t('popular'))+'</div>'
      + pop.map(function(p){ return '<a href="#" data-sq="'+esc(p)+'"><span class="sname">'+esc(p)+'</span></a>'; }).join('');
    return;
  }
  var res=B.searchAll(q);
  if(!res.length){
    box.innerHTML='<div style="padding:18px 12px"><p style="font-weight:600">'+esc(t('nosearch'))+' „'+esc(q)+'"</p>'
      + '<p style="font-size:13.5px;color:var(--ink-2);margin-top:6px">'+esc(S.lang==='hr'
         ? 'Pretraga bez rezultata bilježi se i postaje uredničkim zadatkom (Poglavlje 12.3).'
         : 'A search with no results is logged and becomes an editorial task (chapter 12.3).')+'</p>'
      + '<button class="btn btn-primary btn-sm" style="margin-top:12px" data-go="ask" data-closesearch>'+esc(t('ask_cta'))+'</button></div>';
    return;
  }
  var groups={event:[],attraction:[],stay:[],eat:[],itin:[]};
  res.forEach(function(x){ var k=C.kindOf(x.id); if(groups[k]) groups[k].push(x); });
  var GH={event:t('nav_events'), attraction:t('nav_dozivi'), stay:t('tab_stay'), eat:t('tab_eat'), itin:t('nav_plan')};
  var out='';
  Object.keys(groups).forEach(function(k){
    if(!groups[k].length) return;
    out+='<div class="gh">'+esc(GH[k])+'</div>'
      + groups[k].slice(0,3).map(function(x){
          var scr = k==='event'?'event':k==='attraction'?'attraction':k==='itin'?'itin':'stayitem';
          var meta = k==='event' ? P.shortWhen(x.from,x.to,S.lang)
                   : k==='stay' ? (t('from')+' '+C.eur(x.from))
                   : k==='itin' ? x.dur : '';
          return '<a href="#" data-go="'+scr+'" data-param="'+x.id+'" data-closesearch>'
            + '<span class="sname">'+esc(tx(x.name).t)+'</span><span class="smeta">'+esc(meta)+'</span></a>'; }).join('');
  });
  out+='<div style="padding:10px 12px"><a href="#" data-searchall="'+esc(q)+'" style="font-weight:600;color:var(--brand)">'
    + esc(S.lang==='hr'?'Prikaži sve rezultate':'Show all results')+' ('+res.length+') →</a></div>';
  box.innerHTML=out;
}
document.getElementById('searchBtn').addEventListener('click', openSearch);
document.getElementById('searchClose').addEventListener('click', closeSearch);
document.getElementById('searchClose').textContent = t('close');
document.getElementById('q').addEventListener('input', function(){ renderSugg(this.value); });
document.getElementById('searchOverlay').addEventListener('click', function(e){ if(e.target===this) closeSearch(); });
document.addEventListener('click', function(e){
  var a=e.target.closest('[data-sq]');
  if(a){ e.preventDefault(); document.getElementById('q').value=a.getAttribute('data-sq'); renderSugg(a.getAttribute('data-sq')); return; }
  var b=e.target.closest('[data-searchall]');
  if(b){ e.preventDefault(); closeSearch(); C.go('search', b.getAttribute('data-searchall')); return; }
  if(e.target.closest('[data-closesearch]')) closeSearch();
});

/* ---- toolbar ---- */
document.getElementById('jump').addEventListener('change', function(){
  var v=this.value.split(':');
  C.go(v[0], v[1]||null);
});
function setVw(mode){
  var st=document.getElementById('stage');
  st.setAttribute('data-vw', mode);
  document.getElementById('vwMob').setAttribute('aria-pressed', mode==='mobile');
  document.getElementById('vwDesk').setAttribute('aria-pressed', mode==='desktop');
}
document.getElementById('vwMob').addEventListener('click', function(){ setVw('mobile'); });
document.getElementById('vwDesk').addEventListener('click', function(){ setVw('desktop'); });

document.getElementById('themeBtn').addEventListener('click', function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur==='dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
  this.textContent = dark ? (S.lang==='hr'?'Tama':'Dark') : (S.lang==='hr'?'Svjetlo':'Light');
});

document.getElementById('langSel').addEventListener('change', function(){
  S.lang=this.value;
  document.documentElement.setAttribute('lang', S.lang);
  render();
});

document.getElementById('burger').addEventListener('click', function(){
  var n=document.getElementById('mobNav'), open=n.classList.toggle('open');
  this.setAttribute('aria-expanded', open);
});
document.getElementById('planBtn').addEventListener('click', function(){ C.go('myplan'); });
document.getElementById('fab').addEventListener('click', function(){ C.go('ask'); });

document.getElementById('aboutBtn').addEventListener('click', function(){
  showModal(S.lang==='hr'?'O ovom prototipu':'About this prototype',
    (S.lang==='hr'
    ? '<p>Ovo je <strong>interaktivni prototip</strong> novog web sjedišta Turističke zajednice grada Slavonskog Broda, izrađen prema strateškom dokumentu (žične makete W1–W12, dizajn sustav iz Poglavlja 10.2).</p>'
      + '<p><strong>Što je stvarno:</strong> toponimi, ustanove, manifestacije i njihovi mjeseci, geografija destinacije, sva logika filtriranja, jezična strategija i tokovi konverzije.</p>'
      + '<p><strong>Što je demo:</strong> smještajni i ugostiteljski objekti (izmišljena imena), cijene, radna vremena i termini pojedinačnih događanja. Slike su generirani motivi, ne fotografije.</p>'
      + '<p><strong>Čemu služi:</strong></p><ul>'
      + '<li>odobrenju u Turističkom vijeću — nešto što se klika, a ne 101 stranica teksta;</li>'
      + '<li>korisničkom testiranju prije razvoja (osam zadataka iz Poglavlja 17.2);</li>'
      + '<li>prilogu natječajnoj dokumentaciji — ponuditelji vide što se traži.</li></ul>'
      + '<p><strong>Ograničenja:</strong> ovo nije web sjedište. Nema CMS-a, nema slanja e-pošte, nema plaćanja, nema vlastite domene. Prototip provjerava tok i razumijevanje, ne implementaciju.</p>'
      + '<p style="font-size:13px;color:var(--ink-3)">Isprobajte: filtre u kalendaru, „Gdje spavati" na stranici Brodskog kola, obrazac upita s pogrešnim datumom, promjenu jezika na engleski ili njemački (oznaka „nije prevedeno"), zadnje pitanje u Pitaj Brod, i prekidač Mobitel/Desktop.</p>'
    : '<p>This is an <strong>interactive prototype</strong> of the new website for the Slavonski Brod Tourist Board, built from the strategy document (wireframes W1–W12, design system from chapter 10.2).</p>'
      + '<p><strong>What is real:</strong> place names, institutions, festivals and their months, the geography, all filtering logic, the language strategy and the conversion flows.</p>'
      + '<p><strong>What is demo:</strong> accommodation and restaurants (invented names), prices, opening hours and individual event dates. Images are generated motifs, not photographs.</p>'
      + '<p><strong>Limitations:</strong> this is not a website. No CMS, no email, no payments, no domain. The prototype tests the flow, not the implementation.</p>'));
});

/* ---- početno stanje ---- */
function sizeBar(){
  var b=document.querySelector('.bar');
  if(b) document.documentElement.style.setProperty('--barh', b.offsetHeight+'px');
}
window.addEventListener('resize', sizeBar);

buildJump();
render();
sizeBar();

document.addEventListener('click', function(e){
  var g=e.target.closest('#heroGo');
  if(g){ e.preventDefault(); var v=document.getElementById('heroQ').value.trim();
    if(v.length>1) C.go('search', v); else openSearch(); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.id==='heroQ'){
    e.preventDefault(); var v=e.target.value.trim();
    if(v.length>1) C.go('search', v); else openSearch();
  }
});
})();
</script>

</body>
</html>
