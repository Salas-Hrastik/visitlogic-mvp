<title>Sheme — Modul 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{ --ink:#1A2330; --mark:#9E3D22; --sea:#166069; --line:#C9CDC6; --surface:#FAFAF8; }
body{background:#FAFAF8;margin:0;padding:24px;font-family:"IBM Plex Sans",Arial,sans-serif}
figure{margin:0 0 40px;max-width:760px}
svg{display:block;width:100%;height:auto;color:var(--ink);background:#FAFAF8}
svg text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:currentColor}
svg .em-s{stroke:var(--mark)} svg .em-f{fill:var(--mark)}
svg .sea-s{stroke:var(--sea)} svg .sea-f{fill:var(--sea)}
</style>

<figure>
<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img"
 aria-label="Lanac zaštite: konvencija obvezuje državu stranku, država propisuje plan upravljanja upravitelju dobra, upravitelj postavlja pravila na terenu za vodiča i posjetitelja; UNESCO vodi popis i prati stanje, ali sam ne štiti dobro.">
 <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
 <g fill="none" stroke="currentColor" stroke-width="1.6">
   <rect x="18"  y="58" width="150" height="62"/>
   <rect x="205" y="58" width="150" height="62"/>
   <rect x="392" y="58" width="150" height="62"/>
   <rect x="579" y="58" width="123" height="62"/>
 </g>
 <g font-size="12.5" text-anchor="middle">
   <text x="93"  y="84">Konvencija 1972.</text><text x="93"  y="102" font-size="11" opacity=".75">međunarodni ugovor</text>
   <text x="280" y="84">Država stranka</text><text x="280" y="102" font-size="11" opacity=".75">Republika Hrvatska</text>
   <text x="467" y="84">Upravitelj dobra</text><text x="467" y="102" font-size="11" opacity=".75">grad, uprava NP, ustanova</text>
   <text x="640" y="84">Vodič</text><text x="640" y="102" font-size="11" opacity=".75">i posjetitelj</text>
 </g>
 <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)">
   <line x1="168" y1="89" x2="200" y2="89"/><line x1="355" y1="89" x2="387" y2="89"/>
   <line x1="542" y1="89" x2="574" y2="89"/>
 </g>
 <g font-size="10.5" text-anchor="middle" opacity=".8">
   <text x="184" y="44">ratificira</text>
   <text x="371" y="44">plan upravljanja</text>
   <text x="558" y="44">pravila na terenu</text>
 </g>
 <rect x="205" y="196" width="337" height="58" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 5"/>
 <g font-size="12.5" text-anchor="middle">
   <text x="373" y="220">UNESCO</text>
   <text x="373" y="239" font-size="11" opacity=".75">vodi Popis, prati stanje, može upisati na Popis ugrožene baštine</text>
 </g>
 <g fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)">
   <line x1="262" y1="196" x2="262" y2="126"/>
   <line x1="316" y1="126" x2="316" y2="192"/>
 </g>
 <g font-size="10" opacity=".8">
   <text x="252" y="165" text-anchor="end">upis i nadzor</text>
   <text x="330" y="165">izvješćivanje</text>
 </g>
 <g class="em-s" stroke-width="2.4">
   <line x1="24" y1="284" x2="44" y2="304"/><line x1="44" y1="284" x2="24" y2="304"/>
 </g>
 <text x="58" y="292" font-size="12" class="em-f">„Ovaj je grad pod zaštitom UNESCO-a”</text>
 <text x="58" y="309" font-size="11.5" opacity=".85">Točno: štiti ga država i upravitelj dobra; UNESCO vodi popis i prati stanje.</text>
</svg>
<figcaption>Sl. 5.1</figcaption>
</figure>

<figure>
<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img"
 aria-label="Upisano dobro okruženo je zaštitnom zonom; unutar jezgre vrijedi plan upravljanja i pravila upravitelja, u zaštitnoj zoni ograničenja zahvata, a izvan nje redoviti propisi.">
 <rect x="30" y="34" width="420" height="262" fill="currentColor" opacity=".04"/>
 <rect x="30" y="34" width="420" height="262" fill="none" stroke="currentColor" stroke-width="1.2"/>
 <rect x="86" y="74" width="308" height="182" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="7 5"/>
 <rect x="150" y="118" width="180" height="94" fill="currentColor" opacity=".1"/>
 <rect x="150" y="118" width="180" height="94" fill="none" stroke="currentColor" stroke-width="2.2"/>
 <g font-size="12.5" text-anchor="middle">
   <text x="240" y="160" class="em-f">upisano dobro</text>
   <text x="240" y="178" font-size="11" opacity=".8">jezgra — predmet upisa</text>
   <text x="240" y="100">zaštitna (buffer) zona</text>
   <text x="240" y="56" opacity=".8">okolni prostor</text>
 </g>
 <g fill="none" stroke="currentColor" stroke-width="1.2">
   <line x1="330" y1="140" x2="486" y2="112"/><line x1="394" y1="190" x2="486" y2="180"/><line x1="450" y1="270" x2="486" y2="246"/>
 </g>
 <g font-size="11.5">
   <text x="494" y="112" class="em-f">Plan upravljanja</text>
   <text x="494" y="129" font-size="10.5" opacity=".85">najava, veličina skupine, termini</text>
   <text x="494" y="180">Ograničenja zahvata</text>
   <text x="494" y="197" font-size="10.5" opacity=".85">gradnja i vizure koje utječu na dobro</text>
   <text x="494" y="246">Redoviti propisi</text>
   <text x="494" y="263" font-size="10.5" opacity=".85">bez posebnog režima upisa</text>
 </g>
 <text x="30" y="318" font-size="11" opacity=".8">Zaštitna zona nije uvijek propisana — postoje dobra bez nje, uz druge mehanizme zaštite.</text>
</svg>
<figcaption>Sl. 5.2</figcaption>
</figure>

<figure>
<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img"
 aria-label="Put do upisa: pristupna lista, nominacijski dosje, stručna procjena ICOMOS-a ili IUCN-a, odluka Odbora za svjetsku baštinu, potom trajno periodično izvješćivanje, s mogućim upisom na Popis ugrožene baštine.">
 <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
 <g fill="none" stroke="currentColor" stroke-width="1.6">
   <rect x="16"  y="48" width="118" height="56"/>
   <rect x="158" y="48" width="118" height="56"/>
   <rect x="300" y="48" width="118" height="56"/>
   <rect x="442" y="48" width="118" height="56"/>
   <rect x="584" y="48" width="120" height="56"/>
 </g>
 <g font-size="11.5" text-anchor="middle">
   <text x="75"  y="72">Pristupna lista</text><text x="75"  y="89" font-size="10.5" opacity=".75">HR: 15 kandidatura</text>
   <text x="217" y="72">Nominacijski</text><text x="217" y="89">dosje</text>
   <text x="359" y="72">Stručna procjena</text><text x="359" y="89" font-size="10.5" opacity=".75">ICOMOS / IUCN</text>
   <text x="501" y="72">Odluka Odbora</text><text x="501" y="89" font-size="10.5" opacity=".75">upis ili odbijanje</text>
   <text x="644" y="72" class="em-f">Nakon upisa</text><text x="644" y="89" font-size="10.5" opacity=".75">periodično izvješćivanje</text>
 </g>
 <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar2)">
   <line x1="134" y1="76" x2="153" y2="76"/><line x1="276" y1="76" x2="295" y2="76"/>
   <line x1="418" y1="76" x2="437" y2="76"/><line x1="560" y1="76" x2="579" y2="76"/>
 </g>
 <rect x="516" y="160" width="188" height="52" fill="none" stroke-width="1.6" class="em-s" stroke-dasharray="6 5"/>
 <g font-size="11.5" text-anchor="middle" class="em-f">
   <text x="610" y="182">Popis ugrožene baštine</text>
   <text x="610" y="199" font-size="10.5">Dubrovnik 1991.–1998.</text>
 </g>
 <g fill="none" stroke-width="1.5" class="em-s" marker-end="url(#ar2)"><line x1="644" y1="106" x2="644" y2="156"/></g>
 <text x="634" y="136" font-size="10.5" class="em-f" text-anchor="end">ako je ugroženo</text>
 <text x="16" y="236" font-size="11" opacity=".8">Upis nije završetak postupka nego početak trajne obveze izvješćivanja i upravljanja.</text>
</svg>
<figcaption>Sl. 5.3</figcaption>
</figure>
